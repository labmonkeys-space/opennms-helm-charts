name: Setup
description: sets up helm lint and testing environment
inputs:
  create-kind-cluster:
    description: "Whether or not to create a kind cluster during setup"
    required: true
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Set up Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1

    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.x"
        check-latest: true

    - name: Set up chart-testing
      uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510  # v2.9.0

    - name: Create kind cluster
      uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa  # v1.15.1
      if: ${{ inputs.create-kind-cluster == 'true' }}
      with:
        node_image: kindest/node:v1.34.0
