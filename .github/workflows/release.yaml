name: release

# Tag-push triggers a release event. The tag's version tracks the umbrella's
# chart version (since the umbrella's strict-pinned matched-pair invariant
# makes it the natural release marker for the stack as a whole).
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Both publish targets are written to: GitHub Pages (Helm repo) and GHCR (OCI).
# See RELEASING.md for the full operator playbook.
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # chart-releaser-action: create Releases, push gh-pages
      packages: write      # helm push + cosign signatures: GHCR OCI artifacts
      id-token: write      # cosign keyless signing and provenance (GitHub OIDC)
      attestations: write  # actions/attest-build-provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "GitHub Action"
          git config user.email "twiki@labmonkeys.space"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1

      # First-run bootstrap: chart-releaser-action requires a gh-pages branch
      # to already exist on the remote. On a brand-new repo it fails with
      # `fatal: invalid reference: origin/gh-pages` and the release dies. Push
      # an orphan empty commit as gh-pages if the branch is missing. Idempotent
      # — subsequent runs skip the push.
      - name: Bootstrap gh-pages branch if missing
        env:
          GIT_AUTHOR_NAME: GitHub Action
          GIT_AUTHOR_EMAIL: twiki@labmonkeys.space
          GIT_COMMITTER_NAME: GitHub Action
          GIT_COMMITTER_EMAIL: twiki@labmonkeys.space
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "gh-pages branch exists; skipping bootstrap"
            exit 0
          fi
          echo "gh-pages branch missing; creating empty orphan ref"
          EMPTY_TREE=$(git hash-object -t tree --stdin </dev/null)
          BOOTSTRAP_COMMIT=$(git commit-tree "$EMPTY_TREE" -m "chore: initialize gh-pages branch")
          git push origin "$BOOTSTRAP_COMMIT:refs/heads/gh-pages"

      # GH Pages leg — packages every chart whose Chart.yaml version is not yet
      # published, creates GitHub Releases, attaches .tgz, updates index.yaml on
      # the gh-pages branch. The action handles helm-dep-update for the umbrella.
      - name: Run chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f  # v1.7.0
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          charts_dir: charts

      # OCI leg — push every newly-packaged .tgz to GHCR. chart-releaser writes
      # only the deltas to .cr-release-packages/, so this is a no-op when no
      # version has changed (the for-loop iterates over zero files).
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      # Push each chart, sign it by digest with cosign keyless, and record the
      # OCI digest and the .tgz digest as provenance subjects. Pages and
      # GitHub Release consumers verify the .tgz, OCI consumers the digest.
      - name: Push and sign packaged charts on GHCR
        id: push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          repo="ghcr.io/${{ github.repository_owner }}/charts"
          # cosign reads the Docker credential store, not helm's registry login.
          cosign login ghcr.io -u "$ACTOR" --password-stdin <<<"$GH_TOKEN"
          : > provenance-subjects.txt
          for tgz in .cr-release-packages/*.tgz; do
            echo "Pushing $tgz → oci://$repo"
            out=$(helm push "$tgz" "oci://$repo" 2>&1)
            echo "$out"
            digest=$(sed -n 's/^Digest: //p' <<<"$out")
            [[ "$digest" == sha256:* ]] || { echo "no digest in helm push output for $tgz" >&2; exit 1; }
            chart=$(helm show chart "$tgz" | sed -n 's/^name: //p')
            cosign sign --yes "$repo/$chart@$digest"
            echo "${digest#sha256:}  $repo/$chart" >> provenance-subjects.txt
            sha256sum "$tgz" | sed "s|  .*/|  |" >> provenance-subjects.txt
          done
          cat provenance-subjects.txt
          if [[ -s provenance-subjects.txt ]]; then echo "attest=true" >> "$GITHUB_OUTPUT"; fi
        shell: bash

      - name: Attest build provenance
        if: steps.push.outputs.attest == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-checksums: provenance-subjects.txt
